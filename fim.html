<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FIM · Vérificateur d'intégrité</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#050505;--pnl:#0b0b0c;--line:rgba(255,255,255,.16);--tx:#f4f4f5;--mu:#8a8a8f;--ok:#9fe3ad;--wa:#f4cd80;--ko:#f3a3a3;color-scheme:dark}
:root[data-theme="light"]{--bg:#fafafa;--pnl:#fff;--line:rgba(0,0,0,.14);--tx:#0a0a0a;--mu:#6b6b70;--ok:#1f7a34;--wa:#8a5a00;--ko:#9a2222;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font:14px/1.5 ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;position:relative;overflow-x:hidden}
.dots{position:fixed;width:170px;height:170px;pointer-events:none;background-image:radial-gradient(var(--mu) 1px,transparent 1.5px);background-size:12px 12px;-webkit-mask-image:radial-gradient(circle at 0 0,#000 55%,transparent 75%);mask-image:radial-gradient(circle at 0 0,#000 55%,transparent 75%);opacity:.35}
.dots.tl{top:0;left:0}
.dots.br{bottom:0;right:0;transform:rotate(180deg)}
main{max-width:960px;margin:0 auto;padding:40px 18px 60px;position:relative;z-index:1}
header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px}
h1{font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;margin:0;font-weight:700}
.tag{color:var(--mu);font-size:.78rem;margin-top:4px}
button.theme{background:none;border:1px solid var(--line);color:var(--tx);width:30px;height:30px;cursor:pointer;font:inherit}
.layout{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:760px){.layout{grid-template-columns:320px 1fr;align-items:start}}
.panel{border:1px solid var(--line);background:var(--pnl);padding:18px}
.lbl{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:8px}
input[type=text]{width:100%;padding:9px 10px;background:transparent;border:1px solid var(--line);color:var(--tx);font:inherit}
input[type=text]:focus{outline:1px solid var(--tx);outline-offset:-1px}
.row{display:flex;flex-direction:column;gap:8px;margin-top:12px}
button.act{font:inherit;letter-spacing:.04em;text-transform:uppercase;font-size:.8rem;font-weight:700;padding:11px 14px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--tx)}
button.act.primary{background:var(--tx);color:var(--bg);border-color:var(--tx)}
button.act:disabled{opacity:.35;cursor:not-allowed}
.status{margin-top:12px;color:var(--mu);font-size:.78rem}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);margin-bottom:14px;border:1px solid var(--line)}
.pill{background:var(--pnl);padding:14px 8px;text-align:center;cursor:pointer;user-select:none}
.pill:hover{background:color-mix(in srgb, var(--pnl) 80%, var(--tx) 10%)}
.pill.active{background:var(--tx);color:var(--bg)}
.pill b{display:block;font-size:1.5rem}
.pill small{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:inherit;opacity:.75}
.pill.add b{color:var(--ok)}.pill.mod b{color:var(--wa)}.pill.del b{color:var(--ko)}
.pill.active b{color:inherit}
.f{border:1px solid var(--line);border-left-width:3px;padding:9px 11px;margin-bottom:6px;font-size:.82rem;word-break:break-all}
.f.add{border-left-color:var(--ok)}.f.mod{border-left-color:var(--wa)}.f.del{border-left-color:var(--ko)}
.f span{display:block;color:var(--mu);font-size:.72rem;margin-top:3px}
.empty{color:var(--mu);font-size:.85rem;padding:8px 0}
footer{color:var(--mu);font-size:.72rem;text-align:center;margin-top:30px;letter-spacing:.03em}
</style>
</head>
<body>
<div class="dots tl"></div><div class="dots br"></div>
<main>
<header>
  <div>
    <h1>⬡ FIM — Vérificateur d'intégrité</h1>
    <div class="tag">100% local · aucun envoi réseau</div>
  </div>
  <button class="theme" id="themeBtn" title="Thème">◐</button>
</header>

<div class="layout">
  <section class="panel">
    <label class="lbl" for="name">Nom du dossier surveillé</label>
    <input id="name" type="text" value="dossier-1">
    <div class="row">
      <button id="scanBtn" class="act primary">Instantané</button>
      <button id="checkBtn" class="act">Vérifier</button>
    </div>
    <div class="status" id="status">Aucun instantané enregistré pour ce nom.</div>
  </section>

  <section class="panel" aria-live="polite">
    <div class="pills">
      <div class="pill add" id="pillAdd" data-filter="add"><b id="nAdd">0</b><small>Ajoutés</small></div>
      <div class="pill mod" id="pillMod" data-filter="mod"><b id="nMod">0</b><small>Modifiés</small></div>
      <div class="pill del" id="pillDel" data-filter="del"><b id="nDel">0</b><small>Supprimés</small></div>
    </div>
    <div id="list"><p class="empty">Lance une vérification pour voir les résultats ici.</p></div>
  </section>
</div>

<input id="picker" type="file" webkitdirectory directory multiple hidden>

<footer>SHA-256 · stocké uniquement dans ce navigateur (localStorage)</footer>
</main>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const picker=$("picker");
let pendingMode=null;
let diffData=null;   // {added, modified, removed}
let filter=null;     // null | "add" | "mod" | "del"

$("themeBtn").onclick=()=>{
  const el=document.documentElement;
  el.setAttribute("data-theme", el.getAttribute("data-theme")==="light" ? "dark" : "light");
};

async function sha256(buf){
  const h=await crypto.subtle.digest("SHA-256",buf);
  return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function key(){ return "fim_"+($("name").value.trim()||"dossier"); }

function refreshStatus(){
  const saved=localStorage.getItem(key());
  if(!saved){ $("status").textContent="Aucun instantané enregistré pour ce nom."; $("checkBtn").disabled=true; return; }
  const data=JSON.parse(saved);
  $("status").textContent=`Dernier instantané : ${new Date(data.date).toLocaleString("fr-FR")} — ${Object.keys(data.files).length} fichier(s).`;
  $("checkBtn").disabled=false;
}
refreshStatus();
$("name").addEventListener("input",refreshStatus);

async function hashAllFiles(fileList,onProgress){
  const map={};
  const files=Array.from(fileList);
  for(let i=0;i<files.length;i++){
    const f=files[i];
    const buf=await f.arrayBuffer();
    map[f.webkitRelativePath||f.name]=await sha256(buf);
    onProgress(i+1,files.length);
  }
  return map;
}

picker.addEventListener("change",async e=>{
  if(!e.target.files.length) return;
  $("status").textContent="Calcul des empreintes…";
  const files=await hashAllFiles(e.target.files,(i,n)=>{$("status").textContent=`Calcul des empreintes… ${i}/${n}`;});
  if(pendingMode==="scan"){
    localStorage.setItem(key(),JSON.stringify({date:Date.now(),files}));
    refreshStatus();
  } else {
    const saved=JSON.parse(localStorage.getItem(key()));
    buildDiff(saved.files,files);
  }
  picker.value="";
});

function buildDiff(before,after){
  const added=[],modified=[],removed=[];
  for(const p in after){
    if(!(p in before)) added.push(p);
    else if(before[p]!==after[p]) modified.push({p,o:before[p],n:after[p]});
  }
  for(const p in before) if(!(p in after)) removed.push(p);
  diffData={added,modified,removed};
  filter=null;
  $("nAdd").textContent=added.length;
  $("nMod").textContent=modified.length;
  $("nDel").textContent=removed.length;
  updatePillsActive();
  renderList();
  $("status").textContent="Vérification terminée.";
  document.querySelector(".layout").scrollIntoView({behavior:"smooth"});
}

function renderList(){
  if(!diffData){ $("list").innerHTML='<p class="empty">Lance une vérification pour voir les résultats ici.</p>'; return; }
  const {added,modified,removed}=diffData;
  const lines=[];
  if(!filter||filter==="add") added.forEach(p=>lines.push(`<div class="f add">+ ${esc(p)}</div>`));
  if(!filter||filter==="mod") modified.forEach(m=>lines.push(`<div class="f mod">~ ${esc(m.p)}<span>${m.o.slice(0,16)}… → ${m.n.slice(0,16)}…</span></div>`));
  if(!filter||filter==="del") removed.forEach(p=>lines.push(`<div class="f del">− ${esc(p)}</div>`));
  $("list").innerHTML=lines.length?lines.join(""):'<p class="empty">Aucun élément dans cette catégorie.</p>';
}

function updatePillsActive(){
  [["pillAdd","add"],["pillMod","mod"],["pillDel","del"]].forEach(([id,f])=>{
    $(id).classList.toggle("active", filter===f);
  });
}

[["pillAdd","add"],["pillMod","mod"],["pillDel","del"]].forEach(([id,f])=>{
  $(id).addEventListener("click",()=>{
    if(!diffData) return;
    filter = (filter===f) ? null : f;
    updatePillsActive();
    renderList();
  });
});

$("scanBtn").onclick=()=>{ pendingMode="scan"; picker.click(); };
$("checkBtn").onclick=()=>{ pendingMode="check"; picker.click(); };
</script>
</body>
</html>
